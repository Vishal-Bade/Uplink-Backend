spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

llm:
  provider: ${LLM_PROVIDER:auto}
  base-url: ${LLM_BASE_URL:https://api.openai.com/v1}
  api-key: ${LLM_API_KEY:${OPENAI_API_KEY:}}
  model: ${LLM_MODEL:gpt-4o-mini}
  embedding-model: ${LLM_EMBEDDING_MODEL:text-embedding-3-small}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:60}

search:
  provider: ${SEARCH_PROVIDER:auto}
  tavily-api-key: ${TAVILY_API_KEY:}

artifacts:
  storage-dir: ${ARTIFACTS_STORAGE_DIR:/app/artifacts}

logging:
  level:
    org.springframework.web: WARN
    com.example.backend: INFO
